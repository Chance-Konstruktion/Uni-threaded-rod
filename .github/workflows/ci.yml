name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          for attempt in 1 2 3; do
            if python -m pip install --upgrade pip && pip install ruff; then
              exit 0
            fi
            echo "pip install failed (attempt ${attempt}/3) - retrying in 5s"
            sleep 5
          done
          echo "pip install failed after 3 attempts"
          exit 1
      - name: Ruff
        run: ruff check .
      - name: Unit tests
        run: python -m unittest discover -s tests -p "test_*.py"

  blender-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
      - name: Headless smoke test
        run: blender -b --factory-startup --python scripts/blender_smoke_test.py
